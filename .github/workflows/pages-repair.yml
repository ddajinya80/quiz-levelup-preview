name: v569 배포 기록 수동 정리
on:
  workflow_dispatch:
permissions:
  deployments: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: v569 배포 비활성화 후 정리
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/7470397878/statuses" -f state=inactive
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/7470397878"
